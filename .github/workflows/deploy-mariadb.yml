name: Deploy Infrastructure, Application, and Logging Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Docker Hub Login
      # ============================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: zineb1112
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================================
      # 3. Build MariaDB Image
      # ============================================================
      - name: Build Custom MariaDB Image
        shell: powershell
        run: |
          docker build `
            -t zineb1112/mariadbubuntu1:latest `
            ./mariadb

      # ============================================================
      # 4. Push Image
      # ============================================================
      - name: Push Image to Docker Hub
        shell: powershell
        run: |
          docker push zineb1112/mariadbubuntu1:latest

      # ============================================================
      # 5. Provision Infrastructure with Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Create Backups Directory
        shell: powershell
        run: |
          if (!(Test-Path -Path "./backups")) {
            New-Item -ItemType Directory -Path "./backups"
          }

      - name: Terraform Init
        shell: powershell
        run: terraform init

      - name: Terraform Apply
        shell: powershell
        run: terraform apply -auto-approve

      # ============================================================
      # 6. Verify Terraform Infrastructure
      # ============================================================
      - name: Verify Terraform Infrastructure
        shell: powershell
        run: |
          Write-Host "--- Checking Terraform State ---"
          terraform show

          Write-Host "--- Verifying Docker Containers ---"
          docker ps --filter "name=MariaDBServer1" --filter "name=backend-api" --filter "name=frontend-service" --filter "name=bastion-bridge"

          Write-Host "--- Verifying Custom Docker Networks ---"
          docker network ls --filter "name=public-net" --filter "name=backend-net" --filter "name=db-net"

      # ============================================================
      # 7. Configure Kubernetes
      # ============================================================
      - name: Configure Kubernetes Context
        shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl config current-context

      # ============================================================
      # 8. Verify Kubernetes Cluster
      # ============================================================
      - name: Verify Kubernetes Cluster
        shell: powershell
        run: |
          Write-Host "--- Checking Cluster Nodes ---"
          kubectl get nodes

          Write-Host "--- Checking Cluster Health ---"
          kubectl cluster-info

      # # # ============================================================
      # 9. Deploy Logging Stack (Loki + Alloy + Grafana)
      # ============================================================
      - name: Deploy Loki, Alloy, Grafana
        shell: powershell
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          # Auto-recovery: Detect crashed Loki pod and purge broken storage & release
          $lokiReady = kubectl get pod loki-0 -n logging -o jsonpath='{.status.containerStatuses[0].ready}' 2>$null
          if ($lokiReady -ne "true") {
            Write-Host "⚠️ Loki is not ready. Performing deep cleanup of release and PVCs..."
            helm uninstall loki -n logging --wait 2>$null
            kubectl delete statefulset loki -n logging --ignore-not-found 2>$null
            kubectl delete pvc -l app=loki -n logging --ignore-not-found 2>$null
            kubectl delete pvc -l app.kubernetes.io/name=loki -n logging --ignore-not-found 2>$null
            kubectl delete pod loki-0 -n logging --force --grace-period=0 2>$null
            Start-Sleep -Seconds 5
          }

          # Deploy Helm release disabling persistent storage to avoid local volume permission crashes
          helm upgrade --install loki grafana/loki-stack `
            --namespace logging `
            --create-namespace `
            -f monitoring/loki-values.yaml `
            --set loki.persistence.enabled=false `
            --set loki.isDefault=true

          # Wait automatically until Loki pod is 1/1 Running and Ready
          Write-Host "Waiting for Loki StatefulSet to roll out completely..."
          kubectl rollout status statefulset/loki -n logging --timeout=120s
      #
============================================================
      # 10. Deploy Application with Helm
      # ============================================================
      - name: Deploy Application with Helm
        shell: powershell
        run: |
          helm upgrade --install mariadb ./my-app `
            --namespace database `
            --create-namespace

      # ============================================================
      # 11. Verify Deployment
      # ============================================================
      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "--- Checking Kubernetes Pods ---"
          kubectl get pods -n database

          Write-Host "--- Checking Kubernetes Services ---"
          kubectl get svc -n database

          Write-Host "--- Checking Persistent Volume Claims ---"
          kubectl get pvc -n database

      # ============================================================
      # 12. Ship Pipeline Logs Directly to Loki via In-Cluster Pod
      # ============================================================
      - name: Send Deployment Log to Loki
        if: always()
        shell: powershell
        run: |
          $status = "${{ job.status }}"
          $timestamp = [long]((Get-Date).ToUniversalTime() - [datetime]'1970-01-01').TotalMilliseconds * 1000000

          # Ensure Loki pod is ready to accept HTTP connections
          kubectl wait --namespace logging --for=condition=ready pod/loki-0 --timeout=60s

          # Clean up transient pusher pod if left over
          kubectl delete pod loki-log-pusher -n logging --ignore-not-found --now

          # Automatically resolve Loki service target
          $lokiSvc = "loki"
          $lokiPort = (kubectl get svc $lokiSvc -n logging -o jsonpath="{.spec.ports[0].port}" 2>$null)
          if (-not $lokiPort) { $lokiPort = "3100" }

          Write-Host "Targeting Loki endpoint: http://${lokiSvc}.logging.svc.cluster.local:${lokiPort}/loki/api/v1/push"

          # Construct JSON payload string
          $json = '{"streams":[{"stream":{"job":"github-actions","workflow":"deploy-mariadb","status":"' + $status + '"},"values":[["' + $timestamp + '","Workflow run finished with status: ' + $status + '"]]}]}'

          # Execute transient log-pusher pod
          kubectl run loki-log-pusher -n logging `
            --image=curlimages/curl:latest `
            --restart=Never `
            -- curl -s -v -X POST "http://${lokiSvc}.logging.svc.cluster.local:${lokiPort}/loki/api/v1/push" `
            -H "Content-Type: application/json" `
            -d "$json"

          # Monitor pusher execution
          Write-Host "Waiting for log pusher pod to complete..."
          $success = $false
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 3
              $phase = (kubectl get pod loki-log-pusher -n logging -o jsonpath="{.status.phase}" 2>$null)
              if ($phase -eq "Succeeded") {
                  $success = $true
                  break
              } elseif ($phase -eq "Failed") {
                  break
              }
          }

          # Output logs
          Write-Host "--- Container Output ---"
          kubectl logs loki-log-pusher -n logging 2>$null

          # Clean up transient pod
          kubectl delete pod loki-log-pusher -n logging --ignore-not-found

          if (-not $success) {
              Write-Error "Failed to send logs to Loki. Review container output above."
          } else {
              Write-Host "✅ Logs successfully pushed to Loki!"
          }