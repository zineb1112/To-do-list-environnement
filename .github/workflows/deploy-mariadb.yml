name: Deploy Infrastructure, Application, and Logging Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Docker Hub Login
      # ============================================================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: zineb1112
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================================
      # 3. Build MariaDB Image
      # ============================================================
      - name: Build Custom MariaDB Image
        shell: powershell
        run: |
          docker build `
            -t zineb1112/mariadbubuntu1:latest `
            ./mariadb

      # ============================================================
      # 4. Push Image
      # ============================================================
      - name: Push Image to Docker Hub
        shell: powershell
        run: |
          docker push zineb1112/mariadbubuntu1:latest

      # ============================================================
      # 5. Provision Infrastructure with Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Create Backups Directory
        shell: powershell
        run: |
          if (!(Test-Path -Path "./backups")) {
            New-Item -ItemType Directory -Path "./backups"
          }

      - name: Terraform Init
        shell: powershell
        run: terraform init

      - name: Terraform Apply
        shell: powershell
        run: terraform apply -auto-approve

      # ============================================================
      # 6. Verify Terraform Infrastructure
      # ============================================================
      - name: Verify Terraform Infrastructure
        shell: powershell
        run: |
          Write-Host "--- Checking Terraform State ---"
          terraform show

          Write-Host "--- Verifying Docker Containers ---"
          docker ps --filter "name=MariaDBServer1" --filter "name=backend-api" --filter "name=frontend-service" --filter "name=bastion-bridge"

          Write-Host "--- Verifying Custom Docker Networks ---"
          docker network ls --filter "name=public-net" --filter "name=backend-net" --filter "name=db-net"

      # ============================================================
      # 7. Configure Kubernetes
      # ============================================================
      - name: Configure Kubernetes Context
        shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl config current-context

      # ============================================================
      # 8. Verify Kubernetes Cluster
      # ============================================================
      - name: Verify Kubernetes Cluster
        shell: powershell
        run: |
          Write-Host "--- Checking Cluster Nodes ---"
          kubectl get nodes

          Write-Host "--- Checking Cluster Health ---"
          kubectl cluster-info

      # ============================================================
      # 9. Deploy Logging Stack (Loki + Alloy + Grafana)
      # ============================================================
      - name: Deploy Loki, Alloy, Grafana
        shell: powershell
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install loki grafana/loki-stack `
            --namespace logging `
            --create-namespace `
            -f monitoring/loki-values.yaml

      # ============================================================
      # 10. Deploy Application with Helm
      # ============================================================
      - name: Deploy Application with Helm
        shell: powershell
        run: |
          helm upgrade --install mariadb ./my-app `
            --namespace database `
            --create-namespace

      # ============================================================
      # 11. Verify Deployment
      # ============================================================
      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "--- Checking Kubernetes Pods ---"
          kubectl get pods -n database

          Write-Host "--- Checking Kubernetes Services ---"
          kubectl get svc -n database

          Write-Host "--- Checking Persistent Volume Claims ---"
          kubectl get pvc -n database

      # # # # # ============================================================
      # 12. Ship Pipeline Logs Directly to Loki via Pod Execution
      # ============================================================
      - name: Send Deployment Log to Loki
        if: always()
        shell: powershell
        run: |
          $status = "${{ job.status }}"
          $timestamp = [long]((Get-Date).ToUniversalTime() - [datetime]'1970-01-01').TotalMilliseconds * 1000000

          # Remove existing pod if present
          kubectl delete pod loki-log-pusher -n logging --ignore-not-found --now

          # Detect Loki service name and port
          $lokiSvc = (kubectl get svc -n logging -l "app=loki" -o jsonpath="{.items[0].metadata.name}")
          if (-not $lokiSvc) { $lokiSvc = "loki" }

          $lokiPort = (kubectl get svc $lokiSvc -n logging -o jsonpath="{.spec.ports[0].port}")
          if (-not $lokiPort) { $lokiPort = "3100" }

          Write-Host "Targeting Loki: http://${lokiSvc}.logging.svc.cluster.local:${lokiPort}/loki/api/v1/push"

          $payload = '{"streams":[{"stream":{"job":"github-actions","environment":"production","workflow":"deploy-mariadb","status":"' + $status + '"},"values":[["' + $timestamp + '","GitHub Actions workflow run completed with status: ' + $status + '"]]}]}'

          # Launch pod to perform curl request
          kubectl run loki-log-pusher -n logging `
            --image=curlimages/curl:latest `
            --restart=Never `
            -- command curl -s -X POST "http://${lokiSvc}.logging.svc.cluster.local:${lokiPort}/loki/api/v1/push" `
            -H "Content-Type: application/json" `
            -d "$payload"

          # Wait up to 60s for pod completion
          Write-Host "Waiting for log push to finish..."
          $completed = $false
          for ($i = 0; $i -lt 30; $i++) {
              $phase = (kubectl get pod loki-log-pusher -n logging -o jsonpath="{.status.phase}")
              if ($phase -eq "Succeeded") {
                  $completed = $true
                  break
              } elseif ($phase -eq "Failed") {
                  break
              }
              Start-Sleep -Seconds 2
          }

          # Output logs from the pusher pod for debugging
          Write-Host "--- Pusher Pod Output ---"
          kubectl logs loki-log-pusher -n logging

          # Clean up pod
          kubectl delete pod loki-log-pusher -n logging --ignore-not-found

          if (-not $completed) {
              Write-Error "Failed to push logs to Loki. Check pod output above."
          } else {
              Write-Host "✅ Logs successfully pushed to Loki!"
          }