name: Monitoring Infrastructure

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  monitoring:
    name: Deploy Monitoring Stack
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Desktop Kubernetes
        shell: powershell
        run: kubectl config use-context docker-desktop

      - name: Create logging namespace
        shell: powershell
        run: |
          kubectl create namespace logging --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Grafana Helm repositories
        shell: powershell
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Deploy Loki
        shell: powershell
        run: |
          helm upgrade --install loki grafana-community/loki `
            --namespace logging `
            --values helm/loki-values.yaml `
            --wait --timeout 10m

      - name: Deploy Alloy
        shell: powershell
        run: |
          helm upgrade --install alloy grafana/alloy `
            --namespace logging `
            --values helm/alloy-values.yaml `
            --wait --timeout 10m

      - name: Deploy Grafana
        shell: powershell
        run: |
          helm upgrade --install grafana grafana-community/grafana `
            --namespace logging `
            --values helm/grafana-values.yaml `
            --wait --timeout 10m

      - name: Deploy dashboards and alerting
        shell: powershell
        run: |
          helm upgrade --install monitoring-grafana ./helm/grafana `
            --namespace logging `
            --wait --timeout 5m

      - name: Restart Grafana
        shell: powershell
        run: kubectl rollout restart deployment/grafana -n logging

      - name: Wait for Grafana
        shell: powershell
        run: kubectl rollout status deployment/grafana -n logging --timeout=5m

      - name: Verify monitoring
        shell: powershell
        run: |
          kubectl get pods -n logging
          kubectl get svc -n logging
          helm list -n logging

      - name: Capture deployment information
        shell: powershell
        run: |
          "DEPLOYMENT_ID=${{ github.run_id }}" | Out-File deployment.env
          "VERSION=${{ github.sha }}" | Add-Content deployment.env
          "ENVIRONMENT=dev" | Add-Content deployment.env

      - name: Capture deployment logs
        shell: powershell
        run: |
          kubectl get pods -n logging 2>&1 | Tee-Object github-actions.log
          kubectl get deployments -n logging 2>&1 | Tee-Object -Append github-actions.log
          kubectl get services -n logging 2>&1 | Tee-Object -Append github-actions.log

      - name: Push GitHub Actions logs to Loki
        if: always()
        shell: bash
        env:
          LOKI_URL: http://localhost:31000
          SERVICE: github-actions
          ENVIRONMENT: dev
          VERSION: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}
        run: |
          if [ -f github-actions.log ]; then
            chmod +x github-actions/push-logs-to-loki.sh
            github-actions/push-logs-to-loki.sh
          fi
