# 1. Grafana Setup & Auto-Dashboard Provisioning
grafana:
  enabled: true
  adminPassword: "admin"
  rbac:
    create: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.logging.svc.cluster.local:3100
          isDefault: true
          editable: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      app-and-deployment-logs:
        json: |
          {
            "annotations": { "list": [] },
            "editable": true,
            "title": "Application & Deployment Logging Dashboard",
            "panels": [
              {
                "title": "GitHub Actions Deployment Logs",
                "type": "logs",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "{job=\"github-actions\"}",
                    "refId": "A"
                  }
                ]
              },
              {
                "title": "Kubernetes Application Logs (MariaDB & Apps)",
                "type": "logs",
                "gridPos": { "h": 12, "w": 24, "x": 0, "y": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\"database|default\"}",
                    "refId": "B"
                  }
                ]
              }
            ],
            "schemaVersion": 38,
            "style": "dark",
            "time": { "from": "now-1h", "to": "now" }
          }

# 2. Disable Promtail & Enable Grafana Alloy
promtail:
  enabled: false

alloy:
  configMap:
    content: |
      // Discover Kubernetes Pod Logs
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel Pod Metadata to Loki Labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "service"
        }
        rule {
          replacement  = "production"
          target_label = "environment"
        }
        // Attach node log path so Alloy knows which log files to read
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      // Collect Pod Logs
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.local.receiver]
      }

      // Forward Logs to Loki
      loki.write "local" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# 3. Loki Configuration & Retention Policies
loki:
  enabled: true
  persistence:
    enabled: false
  isDefault: true

  config:
    schema_config:
      configs:
        - from: "2020-10-15"
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/boltdb-shipper-active
        cache_location: /data/loki/boltdb-shipper-cache
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    chunk_store_config:
      max_look_back_period: 0s

    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s

# 4. Alerting Rules for Failed Deployments & Errors
ruler:
  enabled: true
  alertmanager_url: ""
  config:
    rule_path: /tmp/scratch
  rules:
    deployment-alerts:
      - alert: DeploymentFailureSpike
        expr: sum(rate({job="github-actions", status="failure"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GitHub Actions deployment failed!"
      - alert: ApplicationErrorSpike
        expr: sum(rate({namespace="database"} |= "error" [5m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected in database namespace"