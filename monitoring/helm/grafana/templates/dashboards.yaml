apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-application-dashboard
  namespace: {{ .Values.grafanaNamespace }}
  labels:
    grafana_dashboard: "1"
data:
  application-logs.json: |
{{ .Files.Get "dashboards/application-logs.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-deployment-dashboard
  namespace: {{ .Values.grafanaNamespace }}
  labels:
    grafana_dashboard: "1"
data:
  deployment-logs.json: |
{{ .Files.Get "dashboards/deployment-logs.json" | indent 4 }}
