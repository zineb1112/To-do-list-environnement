apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
    app: mariadb
spec:
  type: ClusterIP
  selector:
    app: mariadb
    release: {{ .Release.Name }}
  ports:
    - name: mysql
      port: {{ .Values.mariadb.service.port }}
      targetPort: 3306
